scope = "rig"
provider = "codex"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecats/{{.AgentBase}}"
nudge = "Run gc hook --claim --json now; if it returns work, execute the claimed formula immediately."
# Default lifecycle for an unspecified-implementation bare sling: feature branch,
# preflight + self-review (rig `formula_vars`), push, then trigger the review→fix
# loop (non-merging — the human is the gate). Explicit review dispatch (-f/--on)
# is never this default. See formulas/mol-polecat-implement.toml.
default_sling_formula = "mol-polecat-implement"
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1

[option_defaults]
model = "gpt-6-luna"
effort = "max"
